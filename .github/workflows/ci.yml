name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  GO_VERSION: '1.23'
  PYTHON_VERSION: '3.12'

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx vitest run
        working-directory: frontend
      - run: npx vite build --logLevel error
        working-directory: frontend
      - name: Check static files
        run: |
          for f in dist/manifest.json dist/sw.js dist/index.html; do
            test -f "frontend/$f" || (echo "Missing: $f"; exit 1)
          done
        working-directory: .

  go-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go-srs/go.sum
      - run: go test ./internal/... -count=1
        working-directory: backend/go-srs

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - name: Ruff check (advisory only, doesn't fail)
        run: ruff check --output-format=github --exit-zero
      - name: Count errors
        run: |
          errors=$(ruff check --statistics | tail -1 | grep -oP '^\s*\d+' || echo "0")
          echo "Ruff errors: $errors"

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: web/requirements.txt
      - run: pip install -r web/requirements.txt biblical-transliteration fastembed sentence-transformers pytest sqlite-vec
        working-directory: .
      - name: Create test fixture database
        run: |
          python3 scripts/create_test_db.py
          ls -la data/memorize.db && echo "memorize.db exists OK" || echo "memorize.db MISSING"
      - name: Run tests
        run: |
          python3 -m pytest tests/ -q --tb=short -k "not TestGraphRoutes and not TestGraphExplore and not TestGraphCentrality and not test_graph and not test_search_graph and not TestMemorizeRoutes and not TestLearnRoutes and not test_hebrew_fsrs_review and not test_openapi_snapshot"
        timeout-minutes: 5

  api-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r web/requirements.txt biblical-transliteration
        working-directory: .
      - name: Test API imports
        run: |
          python3 -c "import sys; sys.path.insert(0,'.'); sys.path.insert(0,'web'); from server import app; print('API imports OK')"
        working-directory: .

  e2e:
    # Browser tests (Playwright) — the same gate scripts/deploy.sh runs, but
    # runnable here where browsers install cleanly (the sandbox/dev shells
    # where `deploy.sh` runs often can't launch them: `spawn /bin/sh ENOENT`).
    # Runs against fixture DBs, never the 1.4GB corpus (see webServer in
    # frontend/playwright.config.ts + SCRIPTURE_DB_PATH support in lib/db.py).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCRIPTURE_DB_PATH: data/test/test.db
      MEMORIZE_DB_PATH: data/memorize.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: web/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: pip install -r web/requirements.txt biblical-transliteration
        working-directory: .
      - name: Create fixture databases
        run: |
          python3 scripts/create_test_db.py
          ls -la data/test/test.db data/memorize.db
      - name: Playwright e2e (deploy-gate spec set)
        working-directory: frontend
        run: npx playwright test --project=chromium app.spec.ts navigation.spec.ts chat.spec.ts chat-streaming.spec.ts wiki.spec.ts --workers=1 --retries=2 --timeout=60000
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
