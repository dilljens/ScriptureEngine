# Pipeline schedule configuration for generator tier scheduling.
#
# Each step defines when to run which generators. The scheduler
# checks generator_meta.last_run_at to determine if a step is due.
#
# Run:   python3 scripts/schedule.py
# Status: python3 scripts/schedule.py --status
# List:   python3 scripts/schedule.py --list

pipeline:
  - name: lightweight
    interval_hours: 1
    tier: lightweight
    generators: ["auto"]
    description: "Lightweight generators — simple SQL lookups, keyword matches, single-book patterns"

  - name: idle
    interval_hours: 24
    tier: idle
    generators: ["auto"]
    description: "Idle generators — cross-canon joins, gematria matching, passage analysis"

  - name: periodic
    interval_hours: 168
    tier: periodic
    generators: ["auto"]
    description: "Periodic generators — full-canon scans, book-pair cross-products"

  - name: full_regen
    interval_hours: 0
    tier: null
    generators: ["all"]
    description: "Full regeneration — runs ALL automatic generators. Manual trigger only (interval=0 means never auto-run)."
