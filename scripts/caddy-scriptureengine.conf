# ScriptureEngine — managed by scriptureengine repo deploy
# Canonical copy lives at scripts/caddy-scriptureengine.conf; deploy.sh rsyncs
# it to /opt/sololedger/deploy/sites/ and hot-reloads ferrum-caddy.
# SPA bind mount: /var/www/scripture/frontend/dist -> /var/www/scripture
scriptureengine.org www.scriptureengine.org {
	root * /var/www/scripture

	handle /api/* {
		reverse_proxy 127.0.0.1:8000
	}

	handle /docs* {
		reverse_proxy 127.0.0.1:8000
	}

	handle /openapi.json {
		reverse_proxy 127.0.0.1:8000
	}

	# Prometheus metrics — must precede the SPA catch-all, or the file server
	# answers with index.html and monitoring scrapes HTML forever.
	handle /metrics {
		reverse_proxy 127.0.0.1:8000
	}

	handle {
		file_server
		try_files {path} /index.html
	}
}
